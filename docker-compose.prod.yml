# Production stack for a VPS (e.g. Netherlands).
# DB and backend are internal; only frontend is exposed on port 80.
#
# First time on server:
#   cp deploy/settings.production.example.yaml backend/.config/settings.yaml
#   # edit settings (LLM key, CORS, DB password)
#
# Start:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# With HTTPS (Caddy + domain):
#   cp deploy/Caddyfile.example deploy/Caddyfile
#   # edit DOMAIN in Caddyfile
#   docker compose -f docker-compose.prod.yml --profile tls up -d --build

services:
  db:
    image: postgres:16-alpine
    container_name: sayfood-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sayfood
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sayfood"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sayfood-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/.config/settings.yaml:/app/.config/settings.host.yaml:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_BASE: /api
    container_name: sayfood-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${SAYFOOD_HTTP_PORT:-80}:80"

  caddy:
    profiles: ["tls"]  # use with docker-compose.prod.tls.yml overlay
    image: caddy:2-alpine
    container_name: sayfood-caddy
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
